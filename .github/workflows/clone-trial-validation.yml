name: Isolated clone address trial validation
on:
  pull_request:
    paths:
      - scripts/verify/clone-address-trial.py
      - scripts/verify/clone-daemon-restart.py
      - scripts/verify/clone-app-recovery.py
      - scripts/verify/clone-current-boot-recovery.py
      - tests/clone-trial/**
      - .github/workflows/clone-trial-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Guard, preservation and failure simulations; no Docker mutation
        run: python3 -m unittest discover -s tests/clone-trial -v

name: Startup observer source validation
on:
  pull_request:
    paths:
      - scripts/verify/observe-harbor-startup.py
      - tests/startup-observer/**
      - .github/workflows/startup-observer-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test observation and failure paths without Docker
        run: python3 -m unittest discover -s tests/startup-observer -p 'test_*.py' -v

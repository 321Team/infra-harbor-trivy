name: Isolated Docker syslog mechanism
on:
  pull_request:
    paths:
      - scripts/verify/syslog-startup-lab.py
      - tests/syslog-lab/**
      - .github/workflows/syslog-isolated-lab.yml
permissions:
  contents: read
jobs:
  docker-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Guard and receiver unit tests
        run: python3 -m unittest discover -s tests/syslog-lab -p 'test_*.py' -v
      - name: Actual disposable Docker experiment
        run: python3 scripts/verify/syslog-startup-lab.py --output "$RUNNER_TEMP/syslog-lab-result"
      - name: Preserve experiment result including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: syslog-lab-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/syslog-lab-result
          if-no-files-found: error
          retention-days: 30

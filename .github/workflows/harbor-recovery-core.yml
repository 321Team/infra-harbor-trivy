name: Harbor Phase 1 recovery core
on:
  pull_request:
    paths:
      - scripts/recovery/**
      - scripts/bootstrap/**
      - scripts/preparation/**
      - tests/recovery-core/**
      - tests/daemon-integration/**
      - .github/workflows/harbor-recovery-core.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Synthetic controller decisions; no Docker or guest access
        run: python3 -B -m unittest discover -s tests/recovery-core -v
      - name: Actual network namespace transitions; synthetic Docker metadata, no guest
        run: sudo -n unshare --net env FDS_RECOVERY_NETNS_TEST=1 python3 -B -m unittest discover -s tests/recovery-core -p test_production_network_linux.py -v
      - name: Shared host provider compatibility with address sequence
        run: sudo -n python3 -B -m unittest discover -s tests/production-address -v
  daemon-reload:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        lifecycle: [daemon, bridge-recreate]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Pin disposable Docker 29.8.2 and build offline test workload
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h3-tools"
          curl --fail --location --retry 2 https://download.docker.com/linux/static/stable/x86_64/docker-29.8.2.tgz -o "$RUNNER_TEMP/h3-tools/docker.tgz"
          echo "995d1ef289677f74fd58d8d2c35727b6a4ee389c69db8638a3e42d0487aa5b0f  $RUNNER_TEMP/h3-tools/docker.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/h3-tools/docker.tgz" -C "$RUNNER_TEMP/h3-tools"
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/h3-tools/workload" tests/daemon-integration/workload.go
      - name: Real private daemon and kernel bridge lifecycle with ordered recovery
        run: |
          sudo -n unshare --net env FDS_DISPOSABLE_DOCKER_TEST=1 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            FDS_LIFECYCLE_CASE=${{ matrix.lifecycle }} \
            FDS_DOCKER_BIN="$RUNNER_TEMP/h3-tools/docker" FDS_WORKLOAD="$RUNNER_TEMP/h3-tools/workload" \
            python3 -B tests/daemon-integration/run.py

name: Harbor Phase 1 recovery core
on:
  pull_request:
    paths:
      - scripts/recovery/**
      - scripts/bootstrap/**
      - scripts/preparation/**
      - tests/recovery-core/**
      - .github/workflows/harbor-recovery-core.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Synthetic controller decisions; no Docker or guest access
        run: python3 -B -m unittest discover -s tests/recovery-core -v

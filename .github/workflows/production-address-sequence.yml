name: Harbor production address sequence simulations
on:
  pull_request:
    paths:
      - scripts/production/**
      - scripts/bootstrap/harbor_address_bootstrap.py
      - tests/production-address/**
      - .github/workflows/production-address-sequence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sequence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Synthetic sequence and Linux temporary journal; no guest or Docker
        run: sudo -n python3 -B -m unittest discover -s tests/production-address -v
      - name: Actual systemd lifecycle in disposable CI; synthetic payload, no Docker
        run: sudo -n env FDS_TEST_SYSTEMD=1 python3 -B -m unittest discover -s tests/production-address -p test_address_systemd.py -v
